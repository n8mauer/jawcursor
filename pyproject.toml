[project]
name = "jawcursor"
version = "0.1.0"
description = "Move the cursor with your eyes (webcam) and click with a jaw clench (AirPods motion)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=1.0",   # pulls in opencv-contrib-python and numpy
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jawcursor = "jawcursor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jawcursor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
